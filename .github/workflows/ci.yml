name: Yojana Mitra CI & Daily Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Daily scheme diff & freshness check at 01:30 UTC (07:00 IST)
    - cron: "30 1 * * *"

jobs:
  test-and-eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic unit test suite (P0-P9)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Run CI Evaluation Gate (Hit@5 & Verdict Accuracy)
        run: python3 eval/ci_gate.py
      - name: Run daily scheme diff pipeline (cached mode)
        run: python3 pipeline/scheduler.py --mode cached
