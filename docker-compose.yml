services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data

  ui:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    command: streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
